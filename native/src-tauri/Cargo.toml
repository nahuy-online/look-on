[package]
name = "look-on"
version = "0.1.0"
description = "Look On — ad-free YouTube viewer with built-in WireGuard VPN (Tauri 2.0)"
authors = ["Look On"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "look_on_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"
rand = "0.8"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# PKCE code-challenge generation for native Google OAuth (AppAuth flow).
base64 = "0.22"
sha2 = "0.10"
# Userspace WireGuard (used by the desktop fallback / future non-Android tunnels).
# On Android the actual tunnel is established by the Kotlin VpnService plugin.
boringtun = { version = "0.6", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enable boringtun-based userspace tunnel on desktop. Off by default to keep
# Android builds slim (Android uses VpnService, not boringtun).
desktop-wg = ["boringtun"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
