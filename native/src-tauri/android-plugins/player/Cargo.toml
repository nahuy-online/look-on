[package]
name = "look-on-player"
version = "0.1.0"
description = "Look On — Tauri 2.0 ExoPlayer + YouTube attestation plugin (Android)"
authors = ["LookOn"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "look_on_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
